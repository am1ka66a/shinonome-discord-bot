name: Bot tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-only
          MYSQL_DATABASE: shinonome_test
          MYSQL_USER: bot_test
          MYSQL_PASSWORD: test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RUN_MYSQL_INTEGRATION: "1"
      MYSQLHOST: 127.0.0.1
      MYSQLPORT: "3306"
      MYSQLUSER: bot_test
      MYSQLPASSWORD: test-only
      MYSQLDATABASE: shinonome_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/smoke_check.py
      - run: python scripts/audit_db_scopes.py
      - run: python -m compileall -q bot.py bot_modules scripts
      - run: python -m pip check
